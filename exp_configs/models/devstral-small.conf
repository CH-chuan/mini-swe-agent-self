# Model: Devstral-Small-2-24B-Instruct-2512
# GPU: 1x A100 80GB

# =============================================================================
# Model Identity
# =============================================================================
MODEL_NAME="mistralai/Devstral-Small-2-24B-Instruct-2512"
SERVED_MODEL_NAME="Devstral-Small"
SNAPSHOT_HASH=""

# =============================================================================
# Paths
# =============================================================================
MODELS_DIR="/project/jingjing_storage/persona_coder/models"
APPTAINER_IMAGE="/project/jingjing_storage/persona_coder/vllm-openai.sif"

# =============================================================================
# GPU Requirements
# =============================================================================
GPU_COUNT=1
GPU_TYPE="a100"
GPU_CONSTRAINT="a100_80gb"

# =============================================================================
# Model Defaults
# =============================================================================
TEMPERATURE="0.0"

# =============================================================================
# vLLM Serving Configuration
# =============================================================================
# Whether to use snapshot hash in model path (true/false)
USE_SNAPSHOT_PATH="false"

# HF_HOME bind path inside container
CONTAINER_HF_HOME="/hf_home"

# Additional environment variables for apptainer (space-separated KEY=VALUE pairs)
VLLM_ENV_VARS=""

# vLLM command-line arguments (appended to vllm serve command)
VLLM_ARGS="--max-model-len 128000"

# Whether HF token is required
REQUIRES_HF_TOKEN="false"

# =============================================================================
# Special Configuration
# =============================================================================
# This model uses a different container (vllm-openai.sif) which has vllm
# pre-installed and uses a different command format (arguments passed directly
# to the container instead of "vllm serve")
VLLM_DIRECT_ARGS="true"
