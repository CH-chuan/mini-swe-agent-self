# Model: Llama-4-Scout-17B-16E-Instruct
# GPU: 4x A100 80GB

# =============================================================================
# Model Identity
# =============================================================================
MODEL_NAME="meta-llama/Llama-4-Scout-17B-16E-Instruct"
SERVED_MODEL_NAME="Llama-4-Scout"
SNAPSHOT_HASH="92f3b1597a195b523d8d9e5700e57e4fbb8f20d3"

# =============================================================================
# Paths
# =============================================================================
MODELS_DIR="/scratch/muh5jn/models"
APPTAINER_IMAGE="/project/jingjing_storage/persona_coder/vllm-openai.sif"

# =============================================================================
# GPU Requirements
# =============================================================================
GPU_COUNT=4
GPU_TYPE="a100"
GPU_CONSTRAINT="a100_80gb"

# =============================================================================
# Model Defaults
# =============================================================================
TEMPERATURE="0.0"
STEP_LIMIT="80"
TIMEOUT="30"
TIME_LIMIT="04:00:00"

# =============================================================================
# vLLM Serving Configuration
# =============================================================================
# Whether to use snapshot hash in model path (true/false)
USE_SNAPSHOT_PATH="true"

# HF_HOME bind path inside container
CONTAINER_HF_HOME="/hf_home"

# Additional environment variables for apptainer (space-separated KEY=VALUE pairs)
VLLM_ENV_VARS=""

# vLLM command-line arguments (appended to vllm serve command)
# Note: --tensor-parallel-size is added automatically based on GPU_COUNT
VLLM_ARGS="--max-model-len 128000"

# Whether HF token is required
REQUIRES_HF_TOKEN="true"

# =============================================================================
# Special Configuration
# =============================================================================
# This model uses vllm-openai.sif which has vllm pre-installed.
# Arguments are passed directly to the container instead of "vllm serve".
VLLM_DIRECT_ARGS="true"
